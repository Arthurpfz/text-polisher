[project]
name = "text-polisher"
version = "0.3.0"
description = "System-wide hotkey text polisher powered by Claude API"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "pynput>=1.7.6",
    "python-dotenv>=1.0.0",
    "tomli_w>=1.0.0",
]

[project.optional-dependencies]
tray-macos = ["rumps>=0.4.0"]
tray-linux = ["pystray>=0.19.0", "Pillow>=10.0.0"]
dictation = ["openai-whisper>=20231117", "sounddevice>=0.4.6", "soundfile>=0.12.0"]

[project.scripts]
text-polisher = "text_polisher.__main__:main"

[tool.setuptools.package-data]
text_polisher = ["assets/*.png"]
